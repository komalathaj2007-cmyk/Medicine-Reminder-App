<!DOCTYPE html>
<html lang="en" ng-app="medicineApp">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine Reminder - Sign Up</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <script src="js/app.js"></script>
    <script src="js/controller.js"></script>

</head>

<body ng-controller="MedicineController">

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            <i class="fa-solid fa-capsules"></i>
            Medicine Reminder
        </div>

        <ul>
            <li><a href="index.html">Login</a></li>
        </ul>

    </nav>

    <!-- Signup Form -->

    <div class="form-container">

        <h2>
            <i class="fa-solid fa-user-plus"></i>
            Create Account
        </h2>

        <form name="signupForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" ng-model="fullname" placeholder="Enter Full Name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" ng-model="email" placeholder="Enter Email" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" ng-model="phone" placeholder="Enter Mobile Number" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" ng-model="username" placeholder="Enter Username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" ng-model="password" placeholder="Enter Password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" ng-model="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <select ng-model="gender">
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" ng-model="dob">
            </div>

            <button type="button"
                class="btn"
                onclick="window.location='dashboard.html'">

                Sign Up

            </button>

            <br><br>

            <p style="text-align:center;">

                Already have an account?

                <a href="index.html">

                    Login

                </a>

            </p>

        </form>

    </div>

    <div class="footer">

        © 2026 Medicine Reminder App

    </div>

</body>

</html>
